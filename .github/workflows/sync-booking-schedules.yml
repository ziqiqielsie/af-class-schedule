name: Sync booking timetables

on:
  schedule:
    # 14:00 SGT on the 1st and 15th ≈ every two weeks
    - cron: "0 6 1,15 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-booking-schedules
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Compare public timetables
        env:
          AF_TELEGRAM_BOT_TOKEN: ${{ secrets.AF_TELEGRAM_BOT_TOKEN }}
          AF_TELEGRAM_CHAT_ID: ${{ secrets.AF_TELEGRAM_CHAT_ID }}
        run: python3 scripts/sync-booking-schedules.py

      - name: Push timetable updates
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/schedules.js
          if git diff --staged --quiet; then
            echo "No timetable file changes."
            exit 0
          fi
          git commit -m "Sync class schedules from WellnessLiving and the booking hub."
          git push
