name: Book Tanjong Pagar Thursday Yoga

on:
  schedule:
    # 13:59 Saturday SGT = 05:59 UTC
    - cron: "59 5 * * 6"
  workflow_dispatch:
    inputs:
      notify_test:
        description: Send a WhatsApp test message instead of booking
        type: boolean
        default: false

jobs:
  book:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Book class
        env:
          AF_BOOKING_EMAIL: ${{ secrets.AF_BOOKING_EMAIL }}
          AF_BOOKING_WHATSAPP: ${{ secrets.AF_BOOKING_WHATSAPP }}
          AF_CALLMEBOT_APIKEY: ${{ secrets.AF_CALLMEBOT_APIKEY }}
        run: |
          if [ "${{ github.event.inputs.notify_test }}" = "true" ]; then
            python3 scripts/book-tanjong-pagar-thursday-yoga.py --notify-test
            exit 0
          fi
          if [ -z "$AF_BOOKING_EMAIL" ] || [ -z "$AF_BOOKING_WHATSAPP" ]; then
            echo "Add repository secrets AF_BOOKING_EMAIL and AF_BOOKING_WHATSAPP first."
            exit 1
          fi
          python3 scripts/book-tanjong-pagar-thursday-yoga.py
